# Config build untuk Railway (Nixpacks). Repo ini gabungan PHP + Node
# (Vite/Inertia), jadi build phase perlu eksplisit menjalankan keduanya.
#
# Migration dijalankan di setiap start, bukan cuma sekali di build — aman
# karena idempotent, dan Railway tidak punya "release phase" terpisah
# seperti Heroku.

[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm ci",
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host 0.0.0.0 --port $PORT"
